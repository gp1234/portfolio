<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minimal 3D Sphere</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden; /* Hide scrollbars if sphere goes slightly out of bounds */
        background-color: #0d1117; /* Dark background for good contrast with sphere */
      }

      /* Styles for the sphere container (full screen) */
      #sphere-container {
        position: absolute; /* Use absolute to cover the entire body */
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 0; /* Ensures it's the background */
        overflow: hidden;
      }

      #sphere-container canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="sphere-container"></div>

    <script>
      // Ensure THREE and OrbitControls are available from CDN
      if (typeof THREE === "undefined") {
        console.error("Three.js not loaded from CDN!");
      }
      // Note: OrbitControls attaches itself to the THREE object.

      const container = document.getElementById("sphere-container");

      if (!container) {
        console.error("Sphere container not found!");
      } else {
        let scene, camera, renderer, controls, points;

        const pointCount = 50000; // Increased point count for a full-screen display
        const sphereRadius = 100; // Original sphere radius for full screen

        // Using a publicly accessible image that should work fine with CORS
        const mapTextureUrl =
          "https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_atmos_2048.jpg";

        const continentColor = new THREE.Color(0xffd700); // Gold
        const oceanColor = new THREE.Color(0x007fff); // Azure Blue

        function init() {
          scene = new THREE.Scene();
          // Add a subtle fog for depth on a full-screen background
          scene.fog = new THREE.FogExp2(0x0d1117, 0.0015);

          camera = new THREE.PerspectiveCamera(
            75, // Field of view
            container.clientWidth / container.clientHeight,
            0.1,
            1000
          );
          camera.position.z = 200; // Camera position for the full-screen sphere

          renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
          renderer.setClearColor(0x000000, 0); // Ensure transparent background for the canvas
          renderer.setSize(container.clientWidth, container.clientHeight);
          renderer.setPixelRatio(window.devicePixelRatio);
          container.appendChild(renderer.domElement);

          controls = new THREE.OrbitControls(camera, renderer.domElement);
          controls.enableDamping = true;
          controls.dampingFactor = 0.05;
          controls.enableZoom = true; // Re-enabled zoom for full-screen interaction
          controls.enablePan = true; // Re-enabled pan
          controls.autoRotate = true;
          controls.autoRotateSpeed = 0.3;

          const geometry = new THREE.BufferGeometry();
          const positions = [];
          const uvs = [];
          const sizes = [];
          const colors = [];

          for (let i = 0; i < pointCount; i++) {
            const phi = Math.acos(2 * Math.random() - 1);
            const theta = Math.random() * Math.PI * 2;

            const x = sphereRadius * Math.sin(phi) * Math.cos(theta);
            const y = sphereRadius * Math.sin(phi) * Math.sin(theta);
            const z = sphereRadius * Math.cos(phi);
            positions.push(x, y, z);

            const u = theta / (2 * Math.PI);
            const v = 1 - phi / Math.PI;
            uvs.push(u, v);
            sizes.push(1.2); // Adjusted point size
          }

          geometry.setAttribute(
            "position",
            new THREE.Float32BufferAttribute(positions, 3)
          );
          geometry.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
          geometry.setAttribute(
            "size",
            new THREE.Float32BufferAttribute(sizes, 1)
          );

          const textureLoader = new THREE.TextureLoader();
          // textureLoader.crossOrigin = "anonymous"; // Often not needed for raw.githubusercontent.com

          textureLoader.load(
            mapTextureUrl,
            function (texture) {
              // Success callback
              const image = texture.image;
              const tempCanvas = document.createElement("canvas");
              tempCanvas.width = image.width;
              tempCanvas.height = image.height;
              const context = tempCanvas.getContext("2d");
              context.drawImage(image, 0, 0);
              const imageData = context.getImageData(
                0,
                0,
                image.width,
                image.height
              );

              for (let i = 0; i < pointCount; i++) {
                const u = uvs[i * 2];
                const v = uvs[i * 2 + 1];
                const pixelX = Math.floor(u * (image.width - 1));
                const pixelY = Math.floor(v * (image.height - 1));
                const pixelIndex = (pixelY * image.width + pixelX) * 4;
                const r = imageData.data[pixelIndex];
                const g = imageData.data[pixelIndex + 1];
                const b = imageData.data[pixelIndex + 2];
                const brightness = (r + g + b) / 3;

                let color =
                  brightness > 110
                    ? continentColor.clone()
                    : oceanColor.clone();

                color.r += (Math.random() - 0.5) * 0.05;
                color.g += (Math.random() - 0.5) * 0.05;
                color.b += (Math.random() - 0.5) * 0.05;

                colors.push(color.r, color.g, color.b);
              }
              geometry.setAttribute(
                "color",
                new THREE.Float32BufferAttribute(colors, 3)
              );
              createPointsObject(geometry);
            },
            undefined, // Progress callback (optional)
            function (err) {
              // Error callback
              console.error(
                "Error loading map texture, using fallback colors:",
                err
              );
              for (let i = 0; i < pointCount; i++) {
                const isLand = Math.random() > 0.7;
                let color = isLand
                  ? continentColor.clone()
                  : oceanColor.clone();
                colors.push(color.r, color.g, color.b);
              }
              geometry.setAttribute(
                "color",
                new THREE.Float32BufferAttribute(colors, 3)
              );
              createPointsObject(geometry);
            }
          );
        }

        function createPointsObject(geometry) {
          const discTexture = new THREE.TextureLoader().load(
            "https://threejs.org/examples/textures/sprites/disc.png"
          );
          const material = new THREE.ShaderMaterial({
            uniforms: {
              globalColorTint: { value: new THREE.Color(0xffffff) },
              pointTexture: { value: discTexture },
            },
            vertexShader: `
                        attribute float size;
                        attribute vec3 color;
                        varying vec3 vColor;
                        void main() {
                            vColor = color;
                            vec4 mvPosition = modelViewMatrix * vec4( position, 1.0 );
                            gl_PointSize = size * ( 300.0 / -mvPosition.z ); // Adjusted scaling factor for point size
                            gl_Position = projectionMatrix * mvPosition;
                        }
                    `,
            fragmentShader: `
                        uniform vec3 globalColorTint;
                        uniform sampler2D pointTexture;
                        varying vec3 vColor;
                        void main() {
                            gl_FragColor = vec4( vColor * globalColorTint, 1.0 );
                            gl_FragColor = gl_FragColor * texture2D( pointTexture, gl_PointCoord );
                            if (gl_FragColor.a < 0.1) discard;
                        }
                    `,
            blending: THREE.AdditiveBlending,
            depthTest: false,
            transparent: true,
          });

          points = new THREE.Points(geometry, material);
          scene.add(points);

          const sizeAttribute = geometry.attributes.size;
          for (let i = 0; i < pointCount; i++) {
            gsap.to(sizeAttribute.array, {
              [i * sizeAttribute.itemSize]: (Math.random() * 1.0 + 0.5) * 1.2, // Adjusted size animation for smaller points
              duration: Math.random() * 2 + 1.5,
              repeat: -1,
              yoyo: true,
              ease: "sine.inOut",
              delay: Math.random() * 2,
            });
          }
          sizeAttribute.needsUpdate = true;
        }

        function onWindowResize() {
          // Only resize if container exists and is part of the DOM
          if (
            container &&
            container.clientWidth > 0 &&
            container.clientHeight > 0
          ) {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
          }
        }

        function animate() {
          requestAnimationFrame(animate);
          if (controls) controls.update();
          if (points && points.geometry) {
            const sizeAttribute = points.geometry.attributes.size;
            if (sizeAttribute) sizeAttribute.needsUpdate = true;
          }
          if (renderer && scene && camera) renderer.render(scene, camera);
        }

        // Check if OrbitControls was loaded correctly
        if (THREE.OrbitControls) {
          init();
          window.addEventListener("resize", onWindowResize, false); // Listen for window resize, not container resize
          animate();
        } else {
          console.error("OrbitControls not loaded correctly from CDN!");
        }
      }
    </script>
  </body>
</html>
